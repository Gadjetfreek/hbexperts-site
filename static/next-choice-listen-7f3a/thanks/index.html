<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><title>Thank You — The Next Choice</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f3ef;color:#1f1f1f;font-family:Arial,Helvetica,sans-serif}main{max-width:700px;margin:0 auto;padding:40px 18px}.brand{font-family:Georgia,serif;font-size:28px;font-weight:700;margin-bottom:18px}.card{background:#fff;border:1px solid #d8d8d2;border-radius:16px;padding:30px;box-shadow:0 3px 12px rgba(0,0,0,.04)}h1{font-family:Georgia,serif;font-size:34px;margin-top:0}.btn{display:inline-block;margin:12px 8px 0 0;border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;text-decoration:none;font-size:16px}.primary{background:#222;color:#fff}.secondary{background:#ececec;color:#222}.status{margin-top:12px;color:#666;font-size:14px}</style></head><body><main><div class="brand">The Next Choice</div><div class="card"><h1>Thank you.</h1><p>Your answers have been submitted.</p><p>If you'd like, you can return to <em>The Next Choice</em> or share this same listening experience with someone else. Please don't tell them what you thought beforehand — we want everyone to hear it fresh.</p><a class="btn secondary" href="../">Back to The Next Choice</a><button class="btn primary" onclick="shareTrial()">Share The Next Choice</button><div id="status" class="status"></div></div></main><script>async function shareTrial(){const url=new URL('../',location.href).href;const data={title:'The Next Choice',text:'Would you listen to this story and answer five short questions?',url};try{if(navigator.share){await navigator.share(data)}else{await navigator.clipboard.writeText(url);document.getElementById('status').textContent='Link copied.'}}catch(e){}}</script></body></html>
