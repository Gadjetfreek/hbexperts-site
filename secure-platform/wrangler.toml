name = "hbe-buyer-platform"
main = "src/issue33-production-worker.js"
compatibility_date = "2026-08-26"
workers_dev = false
preview_urls = false
keep_vars = true

[[routes]]
pattern = "buyer.hbexperts.com"
custom_domain = true

[vars]
HBE_ADMIN_EMAIL = "cwhitehead@hbexperts.com"
HBE_ALERT_TO = "cwhitehead@hbexperts.com"
HBE_ALERT_FROM = "buyer-alerts@hbexperts.com"
# CF_ACCESS_TEAM_DOMAIN and CF_ACCESS_AUD are intentionally not stored here.
# They are live, non-secret dashboard variables and keep_vars=true preserves them.
# hbe-access-worker.js fails closed if either value is missing or invalid.

# MLS integration is intentionally disconnected and unlicensed by default.
# Change MLS_FEED_MODE only after MLS Now approves the exact feed/license for the
# finished HBE use case. Do not infer VOW/IDX/private broker feed in advance.
MLS_FEED_MODE = "UNAPPROVED"
MLS_API_BASE = "https://api.cotality.com/trestle"
# NEVER put MLS_CLIENT_ID or MLS_CLIENT_SECRET in this file/repository.
# After MLS Now/Trestle approval, add them as encrypted Cloudflare Worker secrets.

[[d1_databases]]
binding = "BUYER_DB"
database_name = "hbe-buyer-journey-v2"
database_id = "REPLACE_AFTER_D1_CREATE"

[[ratelimits]]
name = "LOGIN_RATE_LIMITER"
namespace_id = "82626001"
  [ratelimits.simple]
  limit = 6
  period = 60

[[ratelimits]]
name = "SUBMIT_RATE_LIMITER"
namespace_id = "82626002"
  [ratelimits.simple]
  limit = 3
  period = 60

# Optional email config stays disabled until the sending domain/path is verified.
# [[send_email]]
# name = "HBE_ALERT"
# destination_address = "cwhitehead@hbexperts.com"


# Private showing-card photo storage (HBE-auth only; no public bucket/URL).
# Create bucket then replace bucket_name / ensure account binding before deploy:
#   npx wrangler r2 bucket create hbe-showing-photos
# Binding is declared so code can fail-closed when object store is absent.
[[r2_buckets]]
binding = "SHOWING_PHOTOS"
bucket_name = "hbe-showing-photos"
# preview_bucket_name = "hbe-showing-photos-preview"
