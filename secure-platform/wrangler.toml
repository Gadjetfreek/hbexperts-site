name = "hbe-buyer-platform"
main = "src/value-brand-worker.js"
compatibility_date = "2026-08-26"
workers_dev = false
preview_urls = false

[[routes]]
pattern = "buyer.hbexperts.com"
custom_domain = true

[vars]
HBE_ADMIN_EMAIL = "cwhitehead@hbexperts.com"
HBE_ALERT_TO = "cwhitehead@hbexperts.com"
HBE_ALERT_FROM = "buyer-alerts@hbexperts.com"
# Replace these with the exact values from the single HBEUI Cloudflare Access app
# before any #6 deployment. The Worker fails closed if they are missing/wrong.
CF_ACCESS_TEAM_DOMAIN = "REPLACE_AFTER_ACCESS_APPLICATION"
CF_ACCESS_AUD = "REPLACE_AFTER_ACCESS_APPLICATION"

# MLS integration is intentionally disconnected by default.
# MLS_FEED_MODE should match the license approved by MLS Now (expected: VOW for the
# authenticated buyer portal). The provider endpoint may be overridden if Trestle's
# approved environment supplies a different base URL.
MLS_FEED_MODE = "VOW"
MLS_API_BASE = "https://api.cotality.com/trestle"
# NEVER put MLS_CLIENT_ID or MLS_CLIENT_SECRET in this file/repository.
# After MLS Now/Trestle approval, add them as encrypted Cloudflare Worker secrets.

[[d1_databases]]
binding = "BUYER_DB"
database_name = "hbe-buyer-journey-v2"
database_id = "REPLACE_AFTER_D1_CREATE"

[[ratelimits]]
name = "LOGIN_RATE_LIMITER"
namespace_id = "82626001"
  [ratelimits.simple]
  limit = 6
  period = 60

[[ratelimits]]
name = "SUBMIT_RATE_LIMITER"
namespace_id = "82626002"
  [ratelimits.simple]
  limit = 3
  period = 60

# Optional email config stays disabled until the sending domain/path is verified.
# [[send_email]]
# name = "HBE_ALERT"
# destination_address = "cwhitehead@hbexperts.com"
