name: Deploy Public HBE Site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.147.8
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build public Hugo site
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          TZ: America/New_York
        run: |
          hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Enforce public/private boundary
        run: |
          # GitHub Pages is public static hosting. Private buyer or advisor surfaces
          # must never be present in the deploy artifact, even if a future branch
          # accidentally adds them back under static/.
          rm -rf public/advisor public/buyers public/clients public/hbeui public/buyer-portal

          for forbidden in public/advisor public/buyers public/clients public/hbeui public/buyer-portal; do
            if [ -e "$forbidden" ]; then
              echo "SECURITY FAILURE: forbidden private surface present: $forbidden" >&2
              exit 1
            fi
          done

          test -f public/index.html

      - name: Stamp production release
        env:
          RELEASE_ID: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          release = os.environ['RELEASE_ID']
          for path in Path('public').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              if '</head>' in text and 'hbe-production-release' not in text:
                  text = text.replace('</head>', f'<meta name="hbe-production-release" content="{release}"></head>', 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Verify public release before upload
        env:
          RELEASE_ID: ${{ github.sha }}
        run: |
          test -f public/index.html
          grep -q "${RELEASE_ID}" public/index.html
          test ! -e public/advisor
          test ! -e public/buyers
          test ! -e public/clients
          test ! -e public/hbeui
          test ! -e public/buyer-portal

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-production:
    name: Verify public production release
    runs-on: ubuntu-latest
    needs: deploy
    env:
      RELEASE_ID: ${{ github.sha }}
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Verify homepage release and private-surface removal
        run: |
          BASE="${PAGE_URL%/}"
          for attempt in {1..18}; do
            BODY="$(curl --fail --silent --show-error --location --max-time 15 "${BASE}/?verify=${RELEASE_ID}" || true)"
            if printf '%s' "$BODY" | grep -q "${RELEASE_ID}"; then
              echo "Exact public release ${RELEASE_ID} is live."
              break
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "Production never served expected public release ${RELEASE_ID}." >&2
              exit 1
            fi
            sleep 10
          done

          # These URLs must not return successful private application content.
          for path in advisor advisor/consultation-brief.html buyers/donald-kelley clients hbeui buyer-portal; do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' --location "${BASE}/${path}/?verify=${RELEASE_ID}" || true)"
            if [ "$code" = "200" ]; then
              echo "SECURITY FAILURE: /${path}/ is still publicly served." >&2
              exit 1
            fi
          done

      - name: Record verified release
        run: |
          echo "VERIFIED_PUBLIC_RELEASE=${RELEASE_ID}" >> "$GITHUB_STEP_SUMMARY"
          echo "PRODUCTION_URL=${PAGE_URL}" >> "$GITHUB_STEP_SUMMARY"
