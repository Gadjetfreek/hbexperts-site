name: Build Public HBE Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

# All preview builds publish into one branch, so serialize writes.
concurrency:
  group: hbe-preview-publish
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  preview:
    # Do not give write-capable preview jobs to forked PRs.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.147.8

    steps:
      - name: Checkout exact PR commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install Hugo CLI
        run: |
          wget -q -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Define immutable preview identity
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          SOURCE_SHA="${{ github.event.pull_request.head.sha }}"
          SHORT_SHA="${SOURCE_SHA:0:12}"
          PREVIEW_PATH="pr-${PR_NUMBER}/${SHORT_SHA}"
          PREVIEW_ROOT="https://raw.githack.com/${GITHUB_REPOSITORY}/previews/${PREVIEW_PATH}/"
          echo "PR_NUMBER=${PR_NUMBER}" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=${SOURCE_SHA}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "PREVIEW_PATH=${PREVIEW_PATH}" >> "$GITHUB_ENV"
          echo "PREVIEW_ROOT=${PREVIEW_ROOT}" >> "$GITHUB_ENV"

      - name: Build Hugo preview
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          TZ: America/New_York
        run: |
          hugo --gc --minify --baseURL "${PREVIEW_ROOT}"

      - name: Stamp public preview pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, os

          sha = os.environ["SOURCE_SHA"]
          pr = os.environ["PR_NUMBER"]

          for rel in ["index.html", "about/index.html"]:
              path = Path("public") / rel
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8")
              if "</head>" in text:
                  stamp = f'<meta name="hbe-preview" content="pr-{pr}@{sha}">'
                  text = text.replace("</head>", stamp + "</head>", 1)
              path.write_text(text, encoding="utf-8")

          Path("public/__hbe-preview.json").write_text(
              json.dumps({
                  "preview": True,
                  "pull_request": int(pr),
                  "source_sha": sha,
                  "source_branch": os.environ.get("GITHUB_HEAD_REF", ""),
                  "public_pages_only": True
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Validate public build before publish
        run: |
          test -f public/index.html
          test -f public/about/index.html
          test -f public/__hbe-preview.json
          grep -q "${SOURCE_SHA}" public/__hbe-preview.json
          grep -q "hbe-preview" public/index.html
          grep -q "hbe-preview" public/about/index.html

      - name: Create public-only preview bundle
        run: |
          rm -rf preview-public
          mkdir -p preview-public/about preview-public/css preview-public/js
          cp public/index.html preview-public/index.html
          cp public/about/index.html preview-public/about/index.html
          cp public/__hbe-preview.json preview-public/__hbe-preview.json
          if [ -d public/css ]; then cp -a public/css/. preview-public/css/; fi
          if [ -d public/js ]; then cp -a public/js/. preview-public/js/; fi
          if [ -d public/images ]; then cp -a public/images preview-public/images; fi
          if [ -f public/favicon.ico ]; then cp public/favicon.ico preview-public/favicon.ico; fi

          # Safety gate: never publish personal-client or advisor application trees in PR previews.
          test ! -e preview-public/buyers
          test ! -e preview-public/buyer-portal
          test ! -e preview-public/hbeui

      - name: Checkout preview storage branch
        uses: actions/checkout@v4
        with:
          ref: previews
          path: preview-store
          fetch-depth: 0

      - name: Publish immutable public preview bundle
        working-directory: preview-store
        run: |
          mkdir -p "${PREVIEW_PATH}"
          rm -rf "${PREVIEW_PATH:?}"/*
          cp -a ../preview-public/. "${PREVIEW_PATH}/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${PREVIEW_PATH}"
          if git diff --cached --quiet; then
            echo "Preview bundle already published."
          else
            git commit -m "Public preview PR ${PR_NUMBER} at ${SHORT_SHA}"
            git pull --rebase origin previews
            git push origin HEAD:previews
          fi

      - name: Verify public preview endpoints
        run: |
          HOME_URL="${PREVIEW_ROOT}"
          ABOUT_URL="${PREVIEW_ROOT}about/"
          echo "Checking ${HOME_URL}"
          curl --fail --silent --show-error --location \
            --retry 8 --retry-delay 5 --retry-all-errors \
            "${HOME_URL}" > "${{ runner.temp }}/home-preview.html"
          grep -q "hbe-preview" "${{ runner.temp }}/home-preview.html"
          echo "Checking ${ABOUT_URL}"
          curl --fail --silent --show-error --location \
            --retry 8 --retry-delay 5 --retry-all-errors \
            "${ABOUT_URL}" > "${{ runner.temp }}/about-preview.html"
          grep -q "hbe-preview" "${{ runner.temp }}/about-preview.html"

      - name: Publish public preview links to PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HOME_URL="${PREVIEW_ROOT}"
          ABOUT_URL="${PREVIEW_ROOT}about/"
          gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body "$(cat <<EOF
          ### HBE public-site preview ready

          **Exact source commit:** \`${SOURCE_SHA}\`

          [Open HBE homepage preview](${HOME_URL})  
          [Open HBE About preview](${ABOUT_URL})

          This preview bundle intentionally contains public HBE pages/assets only. Personal-client BuyerUI pages and HBEUI surfaces are not published into this preview.
          EOF
          )"
