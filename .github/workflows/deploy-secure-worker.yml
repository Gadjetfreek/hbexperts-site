name: Deploy Secure HBE Buyer Platform

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hbe-secure-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: hbe-secure-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require Cloudflare credential
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN secret is not configured." >&2
            exit 1
          fi

      - name: Deploy secure Buyer Platform
        shell: pwsh
        working-directory: secure-platform
        run: ./deploy.ps1

      - name: Record release
        if: success()
        shell: bash
        run: |
          echo "SECURE_PLATFORM_RELEASE=${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "BUYER_PLATFORM=https://buyer.hbexperts.com" >> "$GITHUB_STEP_SUMMARY"
          echo "DEPLOYED_FROM=GitHub Actions manual workflow" >> "$GITHUB_STEP_SUMMARY"
